<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Anotador personal para la asamblea 2026 «Felices para siempre».">
<meta name="theme-color" content="#0F3F33">
<title>Anotador · Asamblea 2026 «Felices para siempre»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#FBF7F3; --card:rgba(255,255,255,.8); --ink:#26302C; --mute:#5C6661; --line:rgba(80,70,60,.22); --head:#0F3F33; --ctl:rgba(255,255,255,.62); --barbg:rgba(251,247,243,.86); --bgop:1;
  --c-vie:#D9512C; --c-sab:#2F5D3A; --c-dom:#1B5E8C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#171B19;--card:rgba(32,37,34,.82);--ink:#ECEAE6;--mute:#A4ADA8;--line:rgba(255,255,255,.16);--head:#9FD3BF;--ctl:rgba(255,255,255,.07);--barbg:rgba(23,27,25,.88);--bgop:.22;--c-vie:#F08A66;--c-sab:#8CC59A;--c-dom:#7DB7E0}
}
:root[data-theme="dark"]{--bg:#171B19;--card:rgba(32,37,34,.82);--ink:#ECEAE6;--mute:#A4ADA8;--line:rgba(255,255,255,.16);--head:#9FD3BF;--ctl:rgba(255,255,255,.07);--barbg:rgba(23,27,25,.88);--bgop:.22;--c-vie:#F08A66;--c-sab:#8CC59A;--c-dom:#7DB7E0}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Mulish,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--barbg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:30}
#bgfx{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:top center;background-repeat:no-repeat;opacity:0}
body.in #bgfx{opacity:var(--bgop)}
.serif{font-family:Georgia,"Times New Roman",serif}
img{display:block;max-width:100%}

/* Portada */
#cover{max-width:520px;margin:0 auto;padding:0 0 28px}
#cover img{width:100%;height:auto}
.start{display:block;margin:18px 20px 0;padding:16px;border:0;border-radius:12px;background:var(--head);color:#fff;font:700 17px Mulish,system-ui,sans-serif;text-align:center;width:calc(100% - 40px)}
:root[data-theme="dark"] .start{color:#10201A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .start{color:#10201A}}
.hint{margin:12px 24px 0;text-align:center;color:var(--mute);font-size:14px}

/* App */
#app{display:none;max-width:640px;margin:0 auto}
body.in #cover{display:none} body.in #app{display:block}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--barbg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:6px 8px}
.bar button{font:600 15px Mulish,system-ui,sans-serif;border:0;background:transparent;color:var(--mute);padding:10px 12px;border-radius:10px;min-height:44px}
.bar .tab{flex:1;text-align:center}
.bar .tab[aria-selected="true"]{color:#fff}
.bar .tab[data-d="viernes"][aria-selected="true"]{background:var(--c-vie)}
.bar .tab[data-d="sabado"][aria-selected="true"]{background:var(--c-sab)}
.bar .tab[data-d="domingo"][aria-selected="true"]{background:var(--c-dom)}
.bar .tab[data-d="domingo"][aria-selected="true"],.bar .tab[data-d="sabado"][aria-selected="true"],.bar .tab[data-d="viernes"][aria-selected="true"]{color:#fff}
:root[data-theme="dark"] .bar .tab[aria-selected="true"]{color:#10201A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar .tab[aria-selected="true"]{color:#10201A}}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--head);outline-offset:2px}

.day{display:none;padding-bottom:40px}
.day.on{display:block}
.hero{width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.dayhead{padding:0 18px 4px;margin-top:-8px}
.dayhead h1{margin:0;font:700 30px/1.1 Mulish,system-ui,sans-serif;letter-spacing:.04em;color:var(--acc)}
.dayhead p{margin:6px 0 0;font-size:19px;line-height:1.35}
.dayhead small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.sess{margin:26px 18px 10px;font:700 18px Mulish,system-ui,sans-serif;color:var(--acc);border-bottom:2px solid var(--acc);padding-bottom:4px}

.row{display:flex;gap:12px;padding:8px 18px;color:var(--mute);font-size:15px}
.row b{font-weight:600;min-width:46px;color:var(--mute)}
.card{margin:10px 12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.card .tm{font-weight:700;color:var(--acc);font-size:14px}
.lbl{font-weight:700;font-size:12.5px;color:var(--acc);letter-spacing:.03em}
.ttl{font-size:18px;font-weight:700;line-height:1.3;margin:2px 0}
.sub{font-style:italic;margin:0}
.ref{font-size:14px;color:var(--mute);margin:2px 0 0}
.grp{margin:14px 18px 0}
.grp .tm{font-weight:700;color:var(--acc);font-size:14px}
.sp{width:100%;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--ctl);color:var(--ink);font:16px Mulish,system-ui,sans-serif}
.pg{margin-top:12px}
.pgh{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px;font-weight:600}
.pgh button{border:0;background:transparent;color:var(--mute);font:600 13px Mulish,system-ui,sans-serif;padding:8px;min-height:40px}
textarea.nt{display:block;width:100%;min-height:calc(2.2rem * 7);resize:none;overflow:hidden;border:0;border-radius:6px;padding:0 4px;color:var(--ink);font:17px/2.2rem Mulish,system-ui,sans-serif;background-color:var(--ctl);
  background-image:repeating-linear-gradient(transparent 0,transparent calc(2.2rem - 1px),var(--line) calc(2.2rem - 1px),var(--line) 2.2rem);background-attachment:local}
.add{margin-top:10px;width:100%;padding:12px;border:1.5px dashed var(--acc);border-radius:10px;background:transparent;color:var(--acc);font:700 15px Mulish,system-ui,sans-serif;min-height:46px}
.tools{margin:28px 18px 0;display:flex;gap:10px;flex-wrap:wrap}
.tools button{flex:1;min-width:140px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:600 15px Mulish,system-ui,sans-serif;min-height:46px}
.src{margin:18px 18px 0;color:var(--mute);font-size:12.5px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--head);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
:root[data-theme="dark"] #toast{color:#10201A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #toast{color:#10201A}}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

let ST={};try{ST=JSON.parse(localStorage.getItem('anotador26')||'{}')}catch(e){}
let tm;function save(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem('anotador26',JSON.stringify(ST))}catch(e){}},300)}
const rec=id=>ST[id]||(ST[id]={sp:'',pg:['']});
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function grow(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight,t.offsetHeight>0?0:0)+'px'}

function pageBox(id,i,box,addBtn){
  const r=rec(id),w=el('div','pg');
  const h=el('div','pgh');h.appendChild(el('span',null,'Página '+(i+1)));
  if(i>0){const x=el('button',null,'Quitar página');x.onclick=()=>{if(r.pg[i]&&!confirm('Esta página tiene notas. ¿Quitarla?'))return;r.pg.splice(i,1);save();render(id,box,addBtn)};h.appendChild(x)}
  const t=el('textarea','nt');t.value=r.pg[i]||'';t.setAttribute('aria-label','Notas, página '+(i+1));t.spellcheck=true;
  t.oninput=()=>{r.pg[i]=t.value;save();grow(t)};
  w.append(h,t);return w}
function render(id,box,addBtn){
  box.textContent='';const r=rec(id);
  r.pg.forEach((_,i)=>box.appendChild(pageBox(id,i,box,addBtn)));
  box.querySelectorAll('textarea').forEach(grow)}
function notes(id){
  const f=el('div'),r=rec(id);
  const sp=el('input','sp');sp.type='text';sp.placeholder='Orador';sp.value=r.sp||'';sp.setAttribute('aria-label','Nombre del orador');
  sp.oninput=()=>{r.sp=sp.value;save()};
  const box=el('div');const add=el('button','add','+ Agregar página');
  add.onclick=()=>{r.pg.push('');save();render(id,box,add);const a=box.querySelectorAll('textarea');a[a.length-1].focus()};
  f.append(sp,box,add);render(id,box,add);return f}

function build(){
  const host=document.getElementById('days');
  DAYS.forEach(d=>{
    const s=el('section','day');s.id='d-'+d.id;s.style.setProperty('--acc',d.acc);
    const im=el('img','hero');im.src=IMG[d.id];im.alt='Ilustración del programa del '+d.name.toLowerCase();s.appendChild(im);
    const hd=el('div','dayhead');hd.append(el('h1',null,d.name));
    const q=el('p','serif',d.quote);hd.append(q,el('small',null,d.ref));s.appendChild(hd);
    d.sess.forEach((se,si)=>{
      s.appendChild(el('div','sess',se.n));
      se.items.forEach((it,ii)=>{
        const id=d.id+'-'+si+'-'+ii;
        if(it.k==='s'){const r=el('div','row');r.append(el('b',null,it.t[0]),el('span',null,it.t[1]));s.appendChild(r);return}
        const c=el('div','card');c.appendChild(el('div','tm',it.t));
        if(it.label)c.appendChild(el('div','lbl',it.label));
        c.appendChild(el('div','ttl',it.title));
        if(it.k==='n'){
          if(it.sub)c.appendChild(el('p','sub',it.sub));
          if(it.ref)c.appendChild(el('p','ref',it.ref));
          c.appendChild(notes(id));
        }else{
          it.kids.forEach((k,ki)=>{
            const kc=el('div');kc.style.cssText='margin-top:16px;padding-top:12px;border-top:1px solid var(--line)';
            kc.appendChild(el('div','ttl',k.title));if(k.ref)kc.appendChild(el('p','ref',k.ref));
            kc.appendChild(notes(id+'-'+ki));c.appendChild(kc)});
        }
        s.appendChild(c)});
    });
    host.appendChild(s)});
}
function show(d){
  document.body.classList.add('in');document.getElementById('bgfx').style.backgroundImage='url('+BG[d]+')';
  document.querySelectorAll('.day').forEach(x=>x.classList.toggle('on',x.id==='d-'+d));
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.d===d));
  document.querySelectorAll('textarea.nt').forEach(grow);window.scrollTo(0,0)}
function route(){const h=location.hash.slice(1);if(['viernes','sabado','domingo'].includes(h))show(h);else{document.body.classList.remove('in')}}
build();
document.getElementById('go').onclick=()=>{location.hash='viernes'};
document.getElementById('home').onclick=()=>{history.replaceState(null,'',location.pathname+location.search);document.body.classList.remove('in');window.scrollTo(0,0)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.d});
window.addEventListener('hashchange',route);route();

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
document.getElementById('copy').onclick=async()=>{
  let out='ASAMBLEA 2026 · FELICES PARA SIEMPRE\n';
  const add=(id,title,ref)=>{const r=ST[id];if(!r)return;const body=(r.pg||[]).filter(Boolean).join('\n\n');if(!body&&!r.sp)return;out+='\n'+title+(ref?' '+ref:'')+'\n'+(r.sp?'Orador: '+r.sp+'\n':'')+body+'\n'};
  DAYS.forEach(d=>{out+='\n=== '+d.name+' ===\n';d.sess.forEach((se,si)=>se.items.forEach((it,ii)=>{const id=d.id+'-'+si+'-'+ii;
    if(it.k==='n')add(id,it.title,it.ref);else if(it.k==='g')it.kids.forEach((k,ki)=>add(id+'-'+ki,it.title+' – '+k.title,k.ref))}))});
  try{await navigator.clipboard.writeText(out);toast('Notas copiadas')}catch(e){
    const t=document.createElement('textarea');t.value=out;document.body.appendChild(t);t.select();
    try{document.execCommand('copy');toast('Notas copiadas')}catch(_){toast('No se pudo copiar')}t.remove()}
};
